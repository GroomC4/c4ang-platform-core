# Sample configuration for domain services using local-dev-starter
# Copy this to your domain service as application-local.yml

spring:
  profiles:
    active: local

  # DataSource configuration (automatically configured by local-dev-starter)
  # These values are automatically set based on platform.local-dev settings
  # You don't need to configure them manually
  #datasource:
  #  master:
  #    url: jdbc:postgresql://localhost:15432/groom
  #    username: application
  #    password: application
  #    hikari:
  #      maximum-pool-size: 10
  #  replica:
  #    url: jdbc:postgresql://localhost:15433/groom
  #    username: application
  #    password: application
  #    hikari:
  #      maximum-pool-size: 10

  # Redis configuration
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      bootstrap-servers: localhost:9092
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    producer:
      bootstrap-servers: localhost:9092

platform:
  # DataSource routing configuration
  datasource:
    replica-enabled: true
    logging-enabled: true  # Enable logging for local development

  # Local development environment configuration
  local-dev:
    enabled: true
    auto-start: true      # Automatically start Docker Compose
    auto-stop: true       # Automatically stop on shutdown
    wait-for-healthy: true # Wait for all services to be healthy
    health-check-timeout: 60s

    # Customize service ports if needed
    services:
      postgres:
        enabled: true
        primary-port: 15432
        replica-port: 15433
        database: groom
        username: application
        password: application

      redis:
        enabled: true
        port: 6379

      kafka:
        enabled: true
        port: 9092
        use-kraft: true  # Use KRaft mode (no Zookeeper)

# Logging configuration for local development
logging:
  level:
    root: INFO
    com.groom: DEBUG
    com.groom.platform.datasource: DEBUG  # Show DataSource routing logs
    com.groom.platform.localdev: INFO     # Show local-dev status
    org.springframework.jdbc: DEBUG       # Show SQL logs
    org.hibernate.SQL: DEBUG             # Show Hibernate SQL
    org.hibernate.type: TRACE            # Show SQL parameters
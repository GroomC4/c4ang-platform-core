# 로컬 개발 환경용 Docker Compose 설정
# 모든 인프라 서비스를 한번에 실행: Postgres, Redis, Kafka, Schema Registry
#
# 사용법:
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down

services:
  # PostgreSQL Primary (Master)
  postgres-primary:
    image: postgres:17
    container_name: ${PRIMARY_CONTAINER_NAME:-postgres_primary}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PRIMARY_POSTGRES_USER:-application}
      POSTGRES_PASSWORD: ${PRIMARY_POSTGRES_PASSWORD:-application}
      POSTGRES_DB: ${PRIMARY_POSTGRES_DB:-groom}
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8 --auth-host=md5 --auth-local=md5"
      REPL_USER: ${POSTGRES_REPL_USER:-repl_user}
      REPL_PASSWORD: ${POSTGRES_REPL_PASSWORD:-repl_password}
    ports:
      - "${PRIMARY_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ${INFRA_CONFIG_PATH:-.}/docker/postgres/primary-init/005_create_app_user.sh:/docker-entrypoint-initdb.d/005_create_app_user.sh:ro
      - ${SCHEMA_PATH:-./schema.sql}:/docker-entrypoint-initdb.d/010_schema.sql:ro
      - ${INFRA_CONFIG_PATH:-.}/docker/postgres/primary-init/015_grant_table_permissions.sh:/docker-entrypoint-initdb.d/015_grant_table_permissions.sh:ro
      - ${INFRA_CONFIG_PATH:-.}/docker/postgres/primary-init/020_setup_replication.sh:/docker-entrypoint-initdb.d/020_setup_replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # PostgreSQL Replica (Slave)
  postgres-replica:
    image: postgres:17
    container_name: ${REPLICA_CONTAINER_NAME:-postgres_replica}
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${REPLICA_POSTGRES_USER:-application}
      POSTGRES_PASSWORD: ${REPLICA_POSTGRES_PASSWORD:-application}
      POSTGRES_DB: ${REPLICA_POSTGRES_DB:-groom}
      PRIMARY_HOST: ${PRIMARY_SERVICE_HOST:-postgres-primary}
      PRIMARY_PORT: ${PRIMARY_SERVICE_PORT:-5432}
      REPL_USER: ${POSTGRES_REPL_USER:-repl_user}
      REPL_PASSWORD: ${POSTGRES_REPL_PASSWORD:-repl_password}
      APPLICATION_NAME: ${POSTGRES_REPLICA_APPLICATION_NAME:-postgres_replica}
    ports:
      - "${REPLICA_POSTGRES_PORT:-15433}:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ${INFRA_CONFIG_PATH:-.}/docker/postgres/replica-init/010_setup_replica.sh:/docker-entrypoint-initdb.d/010_setup_replica.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-ecommerce_redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # Zookeeper (Kafka 의존성)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    container_name: ${ZOOKEEPER_CONTAINER_NAME:-ecommerce_zookeeper}
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.1
    container_name: ${KAFKA_CONTAINER_NAME:-ecommerce_kafka}
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - ecommerce-network

  # Schema Registry (Avro 스키마 관리)
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.1
    container_name: ${SCHEMA_REGISTRY_CONTAINER_NAME:-ecommerce_schema_registry}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_DEBUG: "false"
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

volumes:
  postgres_primary_data:
    driver: local
  postgres_replica_data:
    driver: local
  redis_data:
    driver: local
  zookeeper_data:
    driver: local
  zookeeper_log:
    driver: local
  kafka_data:
    driver: local

networks:
  ecommerce-network:
    driver: bridge

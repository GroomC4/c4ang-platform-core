services:
  test-postgres-primary:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${IT_PRIMARY_POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${IT_PRIMARY_POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${IT_PRIMARY_POSTGRES_DB:-groom}
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8 --auth-host=md5 --auth-local=md5"
      REPL_USER: ${IT_POSTGRES_REPL_USER:-repl_user}
      REPL_PASSWORD: ${IT_POSTGRES_REPL_PASSWORD:-repl_password}
    ports:
      - "5432"
    volumes:
      - test_postgres_primary_data:/var/lib/postgresql/data
      - ${INFRA_CONFIG_PATH:-.}/docker/postgres/primary-init/005_create_app_user.sh:/docker-entrypoint-initdb.d/005_create_app_user.sh:ro
      - ${SCHEMA_PATH:-./schema.sql}:/docker-entrypoint-initdb.d/010_schema.sql:ro
      - ${INFRA_CONFIG_PATH:-.}/docker/postgres/primary-init/020_setup_replication.sh:/docker-entrypoint-initdb.d/020_setup_replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-postgres-replica:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      - test-postgres-primary
    environment:
      POSTGRES_USER: ${IT_REPLICA_POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${IT_REPLICA_POSTGRES_PASSWORD:-test}
      POSTGRES_DB: ${IT_REPLICA_POSTGRES_DB:-groom}
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
      PRIMARY_HOST: ${IT_PRIMARY_SERVICE_HOST:-test-postgres-primary}
      PRIMARY_PORT: ${IT_PRIMARY_SERVICE_PORT:-5432}
      REPL_USER: ${IT_POSTGRES_REPL_USER:-repl_user}
      REPL_PASSWORD: ${IT_POSTGRES_REPL_PASSWORD:-repl_password}
      APPLICATION_NAME: ${IT_POSTGRES_REPLICA_APPLICATION_NAME:-postgres_replica}
    ports:
      - "5432"
    volumes:
      - test_postgres_replica_data:/var/lib/postgresql/data
      - ${INFRA_CONFIG_PATH:-.}/docker/postgres/replica-init/010_setup_replica.sh:/docker-entrypoint-initdb.d/010_setup_replica.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181"
    volumes:
      - test_zookeeper_data:/var/lib/zookeeper/data
      - test_zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-kafka:
    image: confluentinc/cp-kafka:7.5.1
    restart: unless-stopped
    depends_on:
      test-zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: test-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://test-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092"
    volumes:
      - test_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  test-schema-registry:
    image: confluentinc/cp-schema-registry:7.5.1
    restart: unless-stopped
    depends_on:
      test-kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: test-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: test-kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  test_postgres_primary_data:
  test_postgres_replica_data:
  redis_data:
  test_zookeeper_data:
  test_zookeeper_log:
  test_kafka_data:

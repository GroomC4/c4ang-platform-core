name: Reusable Config Update (CD Trigger)

on:
  workflow_call:
    inputs:
      image_tag: # ECR Push 결과로 받은 이미지 태그
        description: 'The tag of the newly built Docker image (e.g., v1.0.0)'
        required: true
        type: string
      service_slug: # 서비스 슬러그 (예: customer-service)
        description: 'The slug name of the service repository (e.g., customer-service)'
        required: true
        type: string
      infra_repo_name: # Infra 레포지토리 경로 (예: GroomC4/c4ang-infra)
        description: 'The name of the infrastructure repository'
        required: true
        type: string

jobs:
  update-and-commit:
    name: Update Infra Repo and Trigger CD
    runs-on: ubuntu-latest

    # 🚨 permissions는 workflow_call 레벨에서 받거나, needs Job에서 상속받아야 함.
    # 여기서는 workflow_call 레벨에서 받은 permissions를 사용합니다.

    steps:
      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Checkout Config Repository (c4ang-infra)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.infra_repo_name }}
          path: config-repo
          # secrets.GROOM_GITHUB_ACTION_TOKEN은 secrets: inherit을 통해 상속됨
          token: ${{ secrets.GROOM_GITHUB_ACTION_TOKEN }}

      - name: Update Helm values.yaml
        working-directory: config-repo
        env:
          NEW_TAG: ${{ inputs.image_tag }}
        run: |
          # c4ang- 접두사 제거 (예: c4ang-customer-service -> customer-service)
          ORIGINAL_SLUG="${{ inputs.service_slug }}"
          SERVICE_SLUG="${ORIGINAL_SLUG#c4ang-}"

          # config/{profile}/customer-service.yaml 경로 사용
          # profile은 local, prod으로 두개 모두 업데이트한다.
          for PROFILE in local prod; do
            VALUES_FILE="config/${PROFILE}/${SERVICE_SLUG}.yaml"
            echo "Updating file: $VALUES_FILE with tag: ${{ inputs.image_tag }}"
            # yq를 사용하여 'image.tag' 필드 업데이트
            yq -i '.image.tag = env(NEW_TAG)' "$VALUES_FILE"
          done


      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: config-repo
          commit_message: "chore(cd): Update ${{ inputs.service_slug }} image to ${{ inputs.image_tag }} [skip ci]"
          branch: main
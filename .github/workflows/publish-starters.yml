name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'platform-core/**'
      - 'testcontainers-starter/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # Tag 이름에서 버전 추출 (예: v1.2.0 → 1.2.0)
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Using version from tag: $VERSION"
          else
            VERSION="2.0.0-SNAPSHOT"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Not a tag push, using default version: $VERSION"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -Pversion=${{ steps.version.outputs.version }}

      - name: Publish to GitHub Packages
        run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            platform-core/build/libs/
            testcontainers-starter/build/libs/
          retention-days: 7
